<!doctype html><html><head><meta charset="utf-8"><title>Pocket LM responsive review</title><style>body{margin:0;padding:20px;background:#dce2dc;font:14px system-ui}nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}button{padding:10px 16px;border:1px solid #aab6a8;border-radius:8px;background:white;cursor:pointer}iframe{display:block;background:white;border:1px solid #9da99a;box-shadow:0 10px 32px #23332322;margin:auto;width:390px;height:844px}#size{margin-left:auto}h1{font-size:16px;margin:0}</style></head><body><nav><h1>Pocket LM · responsive preview</h1><button data-size="320,568">Small phone</button><button data-size="390,844">Phone</button><button data-size="430,932">Large phone</button><button data-size="1024,768">Desktop</button><span id="size">390 × 844</span></nav><iframe title="Pocket LM preview"></iframe><script>document.querySelector('iframe').src='./index.html?review='+Date.now();document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';document.querySelector('#size').textContent=w+' × '+h;});</script></body></html>
